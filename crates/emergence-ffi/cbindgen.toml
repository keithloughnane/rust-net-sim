language = "C"
include_guard = "EMERGENCE_H"
# Wraps declarations in `extern "C"` when included from C++ (Unreal).
cpp_compat = true
documentation_style = "c99"
header = "/* Emergence Engine C API. Generated by `cargo xtask bindings`; do not edit. */"
usize_is_size_t = true

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[export]
prefix = ""
